name: Deploy to GitHub Pages

on:
  # Every push to main publishes.
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without making a commit.
  workflow_dispatch:

# Permissions the Pages deployment needs. `id-token: write` is what lets deploy-pages prove to
# GitHub that the artifact came from this workflow run, and the deploy fails without it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. `cancel-in-progress: false` matters here: a half-finished Pages deploy
# that gets cancelled can leave the site in a mixed state, so a newer push waits instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 5 and Vitest 2 need Node 18+; 20 is the safe LTS choice.
          node-version: 20
          # Caches ~/.npm keyed on package-lock.json, which cuts most of the install time.
          cache: npm

      # `npm ci` installs exactly the lockfile. It works on Linux even though the lockfile was
      # generated by Windows npm, because the lockfile lists every platform's native binaries for
      # esbuild and rollup, not just the one it was created on.
      - name: Install dependencies
        run: npm ci

      # Gates the deploy on the test suite, so a broken physics core never reaches the site.
      # Drop this step if you would rather deploy faster than safely.
      - name: Run tests
        run: npm test

      # Runs `tsc --noEmit` and then `vite build`, writing to dist/.
      - name: Build
        run: npm run build

      # Optional. It exposes the site's base path as an output for frameworks that need to be told
      # where they are hosted. This app does not: vite.config.ts uses `base: './'`, so every asset
      # reference in the build is relative and works at any path depth. Kept because it is in the
      # official template and costs nothing.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The `github-pages` environment is required by deploy-pages, and gives you the live URL in the
    # Actions run summary and on the repo's Environments page.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
